<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#f4f1eb"/>
  <rect x="190" y="40" width="620" height="480" rx="16" fill="#ffffff" stroke="#e2ddd3" stroke-width="2"/>
  <text x="230" y="98" font-size="22" font-weight="700" fill="#2f3a2e">Add a tip for the team</text>
  <text x="230" y="126" font-size="15" fill="#6b7468">100% of your tip goes to our florists and photographers.</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="230" y="152" width="120" height="58" rx="10" fill="#ffffff" stroke="#c9cfc4" stroke-width="2"/><text x="290" y="187" fill="#2f3a2e">10%</text>
    <rect x="364" y="152" width="120" height="58" rx="10" fill="#7d8f78" stroke="#7d8f78" stroke-width="2"/><text x="424" y="187" fill="#ffffff">15%</text>
    <rect x="498" y="152" width="120" height="58" rx="10" fill="#ffffff" stroke="#c9cfc4" stroke-width="2"/><text x="558" y="187" fill="#2f3a2e">20%</text>
    <rect x="632" y="152" width="138" height="58" rx="10" fill="#ffffff" stroke="#c9cfc4" stroke-width="2"/><text x="701" y="187" fill="#2f3a2e">Custom</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#6b7468"><text x="290" y="230">$12.00</text><text x="424" y="230">$18.00</text><text x="558" y="230">$24.00</text><text x="701" y="230">Any amount</text></g>
  <line x1="230" y1="262" x2="770" y2="262" stroke="#ece8e0" stroke-width="2"/>
  <g font-size="17" fill="#3d463c"><text x="230" y="300">Subtotal</text><text x="770" y="300" text-anchor="end">$120.00</text>
  <text x="230" y="336">Delivery</text><text x="770" y="336" text-anchor="end">$15.00</text>
  <text x="230" y="372" fill="#7d8f78" font-weight="700">Tip (15%)</text><text x="770" y="372" text-anchor="end" fill="#7d8f78" font-weight="700">$18.00</text></g>
  <line x1="230" y1="394" x2="770" y2="394" stroke="#ece8e0" stroke-width="2"/>
  <text x="230" y="432" font-size="20" font-weight="700" fill="#2f3a2e">Total</text><text x="770" y="432" font-size="20" font-weight="700" fill="#2f3a2e" text-anchor="end">$153.00 CAD</text>
  <rect x="230" y="456" width="540" height="46" rx="10" fill="#2f3a2e"/><text x="500" y="485" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Place order</text>
</svg>
